name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **If this is a security vulnerability, do NOT file a public issue** —
        follow the private process in [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
      placeholder: A clear, minimal description.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that reproduces it.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sovereign-vault version
      placeholder: "e.g. 1.1.0 (from `pip show sovereign-vault`)"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version & OS
      placeholder: "e.g. 3.11 on Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: layers
    attributes:
      label: Which detection layers were active?
      multiple: true
      options:
        - "Layer 1 — Regex (always)"
        - "Layer 2 — GLiNER ([ner])"
        - "Layer 3 — Ollama ([llm])"
