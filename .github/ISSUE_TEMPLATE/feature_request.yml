name: Feature request
description: Suggest an enhancement or new detection capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today? Who feels this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? An API sketch helps.
      render: python
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or approaches, and why they fall short.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the library small and single-purpose (reversible PII tokenization), not a platform.
